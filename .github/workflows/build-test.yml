
name: Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        # The release lines of Node that still receive patches.
        node-version: [22.x, 24.x, 26.x]
        # The addon and libmcrypt are compiled on the user's machine, so the
        # compiler differs per platform.
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Node 24.19.0 to 24.21.0 abort the process when an object whose
          # class extends node::ObjectWrap is garbage collected. The addon
          # extends Nan::ObjectWrap because of that, and test/gc.js collects
          # its objects. Only on one of those releases can that test fail.
          - node-version: 24.21.0
            os: ubuntu-latest

    name: node ${{ matrix.node-version }} on ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        # libmcrypt is a submodule. Without it there is nothing to compile.
        submodules: true
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # The node-gyp that npm bundles varies by Node release: 22 ships 11, which
    # does not know Visual Studio 2026 and so cannot find the compiler on the
    # Windows runners. Installing without scripts and calling the pinned
    # devDependency makes the toolchain the same on every matrix entry.
    - name: Install dependencies without building
      run: npm ci --ignore-scripts
    - name: Compile the addon with the pinned node-gyp
      run: npx node-gyp rebuild
    - name: Run tests
      run: npm test

  # What users run is "npm install mcrypt": npm unpacks the tarball and builds
  # it with the node-gyp that it brings along, not the one pinned above. This
  # does the same with the tarball of this commit. It also catches a tarball
  # that lacks the libmcrypt sources.
  package:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # npm in Node 22 brings node-gyp 11, which does not know Visual
          # Studio 2026, the only one on the Windows runners. Nothing in this
          # package can change that.
          - node-version: 22.x
            os: windows-latest

    name: npm install on node ${{ matrix.node-version }}, ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    # For the log: the settings of this Node that reach an addon build, and
    # the node-gyp that npm will use. See the comment in binding.gyp.
    - name: Show how this Node was built
      shell: bash
      run: |
        node -e "
          var v = process.config.variables, path = require('path'), dir = path.dirname(process.execPath);
          console.log(process.version + ': clang ' + v.clang + ', enable_lto ' + v.enable_lto + ', enable_thin_lto ' + v.enable_thin_lto + ', lto_jobs ' + JSON.stringify(v.lto_jobs));
          try {
            var npm = [path.join(dir, '..', 'lib', 'node_modules', 'npm'), path.join(dir, 'node_modules', 'npm')];
            console.log('node-gyp of npm: ' + require(require.resolve('node-gyp/package.json', {paths: npm})).version);
          } catch (e) {
            console.log('node-gyp of npm: not found');
          }
        "
    - name: Pack, install in an empty project and encrypt
      shell: bash
      run: |
        npm pack --pack-destination "$RUNNER_TEMP"
        cd "$RUNNER_TEMP"
        mkdir consumer
        cd consumer
        npm init -y > /dev/null
        npm install ../mcrypt-*.tgz
        node -e "var m = require('mcrypt'); var c = new m.MCrypt('rijndael-128', 'cbc'); c.open('0123456789abcdef', c.generateIv()); if (!c.selfTest() || c.decrypt(c.encrypt('ok')).toString('utf8', 0, 2) !== 'ok') process.exit(1); console.log('the installed package works')"
